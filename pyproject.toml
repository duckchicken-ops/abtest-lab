[project]
name = "abtest-lab"
version = "0.1.0"
description = "Simulation toolkit for validating A/B test reliability: peeking, multiple testing, and SRM"
readme = "README.md"
authors = [
    { name = "duckchicken-ops", email = "311963054+duckchicken-ops@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
